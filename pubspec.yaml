name: wheel_out_game2
description: "Perfect Wheel Out - Production-style animated parking puzzle game. Slide cars, free the red wheel, build your profile, unlock rewards, and master 60 levels with fluid Flutter animations."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
